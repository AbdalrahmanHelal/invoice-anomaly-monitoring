[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-anomaly-demo"
version = "0.1.0"
description = "Sanitized demo of a vendor-specific invoice anomaly detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.0"]
ui = ["streamlit>=1.50", "pandas>=2.0", "openpyxl>=3.1", "altair>=5"]

[project.scripts]
invoice-anomaly-demo = "invoice_anomaly_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_anomaly_demo = ["config/rules.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
